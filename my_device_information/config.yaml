name: My Device Information
version: "1.0.0"
slug: my_device_information
description: One click snapshot of your Home Assistant setup, ready to paste into an AI chat
url: https://github.com/your-name/ha-my-device-information
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:information-box-outline
panel_title: My Device Information
panel_admin: true
hassio_api: true
hassio_role: default
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: true
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: addon_config
    read_only: false
options:
  save_location: share
  save_subfolder: my_device_information
  keep_history: false
  redaction: standard
  include_attributes: true
  include_configuration: true
  include_logs: true
  log_lines: 40
  include_services: false
  exclude_domains: ""
  auto_refresh_hours: 0
schema:
  save_location: list(share|media|addon_config)
  save_subfolder: str?
  keep_history: bool
  redaction: list(none|standard|strict)
  include_attributes: bool
  include_configuration: bool
  include_logs: bool
  log_lines: int(10,500)
  include_services: bool
  exclude_domains: str?
  auto_refresh_hours: int(0,168)
