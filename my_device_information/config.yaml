name: My Device Information
version: "1.1.2"
slug: my_device_information
image: ghcr.io/jonathangibson98/{arch}-read-my-device-information
description: One click snapshot of your Home Assistant setup, ready to paste into an AI chat
url: https://github.com/jonathangibson98/read-my-device-information
arch:
  - amd64
  - aarch64
init: false
ingress: true
panel_icon: mdi:information-box-outline
panel_title: My Device Information
hassio_api: true
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: true
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: addon_config
    read_only: false
options:
  save_location: share
  save_subfolder: my_device_information
  keep_history: false
  history_keep: 20
  redaction: standard
  include_attributes: true
  include_configuration: true
  include_logs: true
  log_lines: 40
  include_services: false
  exclude_domains: ""
  auto_refresh_hours: 0
schema:
  save_location: list(share|media|addon_config)
  save_subfolder: str?
  keep_history: bool
  history_keep: int(0,1000)
  redaction: list(none|standard|strict)
  include_attributes: bool
  include_configuration: bool
  include_logs: bool
  log_lines: int(10,500)
  include_services: bool
  exclude_domains: str?
  auto_refresh_hours: int(0,168)
